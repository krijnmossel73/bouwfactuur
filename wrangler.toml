name = "bouwfactuur"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"

# ── D1 cloud storage ──
# 1. Create the database:    npx wrangler d1 create bouwfactuur
# 2. Paste the database_id below and uncomment the block
# 3. Apply the schema:       npx wrangler d1 execute bouwfactuur --remote --file=./schema.sql
# 4. Commit & push — the next deploy picks up the binding.
# Until then the app keeps using localStorage (no breakage).
#
# [[d1_databases]]
# binding = "DB"
# database_name = "bouwfactuur"
# database_id = "PASTE-DATABASE-ID-HERE"
