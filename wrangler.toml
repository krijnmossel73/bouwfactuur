name = "bouwfactuur"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"

# ── D1 cloud storage ──
# Database "bouwfactuur" (region: WEUR). Schema: ./schema.sql
# For local dev: npx wrangler d1 execute bouwfactuur --local --file=./schema.sql

[[d1_databases]]
binding = "DB"
database_name = "bouwfactuur"
database_id = "291bd967-987d-4371-b3dc-9f4e3209c213"

# ── Supabase Auth (server-side JWT verification) ──
# Uncomment and set after creating your Supabase project.
# The middleware verifies tokens against <SUPABASE_URL>/auth/v1/.well-known/jwks.json

[vars]
SUPABASE_URL = "https://mjdqxclxexyhviohomyq.supabase.co"
STRIPE_PRICE_ID = "price_1UEq6uKH5lzsZkI174DscKMV"

# Secrets (NOT in this file — set via CLI):
#   npx wrangler pages secret put STRIPE_SECRET_KEY --project-name bouwfactuur
#   npx wrangler pages secret put STRIPE_WEBHOOK_SECRET --project-name bouwfactuur
#   npx wrangler pages secret put B2BROUTER_API_KEY --project-name bouwfactuur   # test_… or prod_…
#
# Optional B2Brouter settings (not secret):
# B2BROUTER_ACCOUNT_ID = "12345"
# B2BROUTER_API_VERSION = "2026-06-26"
